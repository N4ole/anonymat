# Mises à jour automatiques des dépendances Python : PR testée par la CI, fusionnée
# automatiquement si tout est vert (automerge.yml), puis release correctrice (release.yml).
# Les actions GitHub sont épinglées sur leur version majeure, qui reçoit les correctifs
# toute seule (un bot ne peut pas fusionner une PR qui modifie des workflows).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # OpenCV 5 supprime les cascades Haar (détection de secours) : passage
      # à faire à la main, avec portage et tests. Les 4.x restent proposées.
      - dependency-name: opencv-python-headless
        update-types: ["version-update:semver-major"]
    groups:
      dependances-python:
        patterns: ["*"]
