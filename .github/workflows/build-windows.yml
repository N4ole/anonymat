# Compilation Windows réutilisable : appelée par ci.yml et release.yml (même .exe partout).
name: Build Windows

on:
  workflow_call:
    inputs:
      ref:
        description: Commit à compiler (vide = celui de l'événement)
        type: string
        default: ""
    outputs:
      version:
        description: Version lue dans version.py
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Compiler le .exe
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Dépendances (versions figées)
        run: pip install -r requirements.txt

      - name: Cache du modèle IA
        uses: actions/cache@v6
        with:
          path: models/face_detection_yunet_2023mar.onnx
          key: yunet-2023mar-8f2383e4

      - name: Modèle IA YuNet (empreinte SHA-256 vérifiée, échec si absent)
        run: python tools_model.py

      - name: Tests
        run: python -m pytest

      - name: Compilation PyInstaller
        run: pyinstaller --noconfirm AnonymiseurVisages.spec

      - name: Auto-test du .exe depuis un dossier au nom accentué
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $d = "$env:RUNNER_TEMP\Dossier é à ü"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item dist\AnonymiseurVisages.exe $d
          $log = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath "$d\AnonymiseurVisages.exe" -ArgumentList "--selftest","--require-ai","--log",$log -Wait -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "Auto-test en échec" }
          if (-not (Select-String -Path $log -SimpleMatch "version=$v")) { throw "Version incorrecte dans le .exe" }
          $fv = (Get-Item dist\AnonymiseurVisages.exe).VersionInfo.ProductVersion
          Write-Host "Version Windows du .exe : $fv"
          if ($fv -ne $v) { throw "Ressource de version Windows incorrecte ($fv au lieu de $v)" }

      - name: Nommage final
        shell: bash
        run: mv dist/AnonymiseurVisages.exe "dist/AnonymiseurVisages-${{ steps.version.outputs.version }}-windows-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: AnonymiseurVisages-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
