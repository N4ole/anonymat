# Release automatique, sans intervention :
#  * __version__ modifié dans version.py et poussé sur main  -> release de cette version ;
#  * étiquette vX.Y.Z poussée                                -> release de cette version ;
#  * mise à jour de dépendance fusionnée (automerge.yml), contrôle hebdomadaire,
#    ou lancement manuel avec « auto_patch »                 -> si du code a changé depuis la
#    dernière release : version correctrice X.Y.(Z+1) + CHANGELOG générés, puis release.
# Publie le .exe, son empreinte SHA-256, une attestation de provenance et les notes du CHANGELOG.
name: Release

on:
  push:
    branches: [main]
    paths: [version.py]
    tags: ["v*.*.*"]
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:
    inputs:
      auto_patch:
        description: Publier une version correctrice si du code a changé depuis la dernière release
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Préparer
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit de la version correctrice
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Vérifier version, étiquette et CHANGELOG
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.auto_patch) }}
        run: |
          set -euo pipefail
          version() { python3 -c 'from version import __version__; print(__version__)'; }
          v=$(version); tag="v$v"; ref=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::L'étiquette $GITHUB_REF_NAME ne correspond pas à version.py ($v)"; exit 1
          fi
          publish=true
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            publish=false
            if [[ "$AUTO" == "true" ]]; then
              # Changements de code depuis la dernière release (la doc seule ne compte pas)
              git fetch --tags --force -q
              mapfile -t changes < <(git log "$tag"..HEAD --format='%s' -- requirements.txt '*.py' '*.spec' haar models)
              if (( ${#changes[@]} )); then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                v=$(python3 .github/scripts/bump_patch.py "${changes[@]}"); tag="v$v"
                git commit -qam "Version $v (correctifs automatiques)"
                git push -q origin HEAD:main
                ref=$(git rev-parse HEAD); publish=true
                echo "Version correctrice $v créée (${#changes[@]} changement(s))."
              else
                echo "Aucun changement de code depuis $tag : rien à publier."
              fi
            else
              echo "La release $tag existe déjà : rien à publier."
            fi
          fi
          if [[ "$publish" == "true" ]]; then
            python3 .github/scripts/changelog_notes.py "$v" > /dev/null
          fi
          { echo "version=$v"; echo "tag=$tag"; echo "publish=$publish"; echo "ref=$ref"; } >> "$GITHUB_OUTPUT"

  build:
    name: Windows
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  publish:
    name: Publier
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # créer l'étiquette et la release
      id-token: write       # attestation de provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: AnonymiseurVisages-windows
          path: dist
      - name: Empreintes SHA-256
        working-directory: dist
        run: sha256sum *.exe | tee SHA256SUMS.txt
      - name: Attestation de provenance (prouve que le .exe vient de cette CI)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.exe
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          python3 .github/scripts/changelog_notes.py "$VERSION" > notes.md
          {
            echo
            echo "---"
            echo "### Vérifier le téléchargement"
            echo '```powershell'
            echo "Get-FileHash .\\AnonymiseurVisages-$VERSION-windows-x64.exe -Algorithm SHA256"
            echo '```'
            echo "doit donner la valeur de \`SHA256SUMS.txt\`. Avec GitHub CLI, preuve que le .exe a été compilé par la CI de ce dépôt :"
            echo '```'
            echo "gh attestation verify AnonymiseurVisages-$VERSION-windows-x64.exe -R $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md
          gh release create "$TAG" dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "Anonymat $VERSION" --notes-file notes.md --latest
